version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Most malicious npm releases are pulled within days; let them be caught first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "- r "
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ". e "
