version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    # Most malicious npm releases are pulled within days; let them be caught first.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "- r "
    ignore:
      # typescript-eslint supports only TypeScript <6.1; lift this when it catches up.
      - dependency-name: "typescript"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    commit-message:
      prefix: ". e "
