name: Dependabot auto-merge

# Merge only after Build and Test passes on the PR. `gh pr merge --auto` alone
# merges immediately when main has no required checks, which once let a
# breaking TypeScript bump through.
on:
  workflow_run:
    workflows: [Build and Test]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'JayBazuzi/RetroMindMap' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    steps:
      - name: Merge the PR that passed
        # --match-head-commit refuses if the PR moved on since this run.
        run: >-
          gh pr merge --rebase "$BRANCH"
          --repo "$GITHUB_REPOSITORY"
          --match-head-commit "$SHA"
        env:
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
