name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "17 7 * * 0"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: ./build-and-test.cmd
